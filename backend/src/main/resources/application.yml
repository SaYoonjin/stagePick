server:
  port: 8080

spring:
  application:
    name: stagepick-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/stagepick
    username: stagepick
    password: stagepick
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info